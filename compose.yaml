services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: kruga_shop
      POSTGRES_USER: kruga_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - kruga_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kruga_app -d kruga_shop"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kruga_postgres:
