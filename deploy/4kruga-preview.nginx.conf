server {
    listen 443 ssl;
    server_name 4kruga-preview.example.com;
    ssl_certificate /etc/letsencrypt/live/4kruga-preview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4kruga-preview.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log off;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3104;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
    }
}
